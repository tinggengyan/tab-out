<style>

ow:hover .close-tab,.tab-row:focus-within .close-tab{opacity:1}.selecting .tab-row{padding:0;border-bottom-color:#e8e5dd}.selecting .tab-main{border-radius:0;margin:0;min-height:72px;padding:12px 20px;align-self:stretch;cursor:pointer}.selecting .tab-main:hover{background:#f0f3ec}.selecting .tab-main[aria-pressed=true]{background:#e6ede2;box-shadow:inset 3px 0 var(--green)}.selection-checkbox{appearance:auto;accent-color:var(--green);width:20px;height:20px;min-width:20px;margin:0;pointer-events:none}.selecting .close-tab{display:none}.selection-note{font-size:13px;color:var(--green);margin:0 0 18px;padding:11px 15px;background:#ecf0e7;border-radius:6px}.selection-bar{position:sticky;bottom:-24px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:17px 0 0;background:var(--paper);margin-top:14px}.selection-bar-inner{background:var(--surface);border:1px solid #b8c8b8;box-shadow:0 5px 20px #26231f0b;border-radius:8px;width:100%;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 18px}.selection-total{font-size:14px;font-weight:550}.selection-detail{font-size:12px;color:var(--muted);margin-top:2px}.selection-actions{display:flex;gap:8px;align-items:center}.saved-list{border-top:1px solid var(--line)}.saved-record{border-bottom:1px solid var(--line)}.saved-header{display:flex;align-items:center;gap:16px;padding:22px 0}.saved-title{flex:1;min-width:0;display:flex;align-items:center;gap:17px;border:0;background:none;text-align:left;padding:4px 0}.chevron{width:18px;font-size:20px;line-height:1;color:var(--muted);transition:transform .15s;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}.chevron[data-open=true]{transform:rotate(90deg)}.saved-name{display:block;font-size:16px;font-weight:550;overflow-wrap:anywhere}.saved-meta{display:block;color:var(--muted);font-size:12px;margin-top:5px}.saved-meta .divider{margin:0 8px;color:#c4bdb2}.record-action{border:1px solid #d0d9ce;background:transparent;color:var(--green);min-width:110px}.saved-body{margin:0 0 22px 34px;padding:0 18px;background:var(--surface);border:1px solid var(--line);border-radius:7px}.saved-body .tab-main{padding:9px 0}.saved-body .tab-row{padding-left:0;padding-right:0}.saved-body .site-name{display:none}.saved-body .tab-domain{font-size:11px}.saved-body .tab-row .text-button{white-space:nowrap;opacity:1}.record-tools{display:flex;gap:4px;border-top:1px solid var(--line);padding:7px 0}.record-tools .text-button:last-child{color:var(--danger)}.empty{padding:65px 20px;text-align:center;color:var(--muted)}.empty h2{font-size:20px;font-weight:550;color:var(--ink);margin:0 0 8px}.empty p{font-size:14px;margin:0 0 20px}.footer{border-top:1px solid var(--line);min-height:66px;display:flex;justify-content:space-between;align-items:center;gap:20px;color:#8a8277;font-size:11px}.footer-links{display:flex;gap:18px}.footer a{color:inherit;text-underline-offset:3px}.toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);max-width:min(620px,calc(100vw - 30px));background:#292922;color:#fffdf9;border-radius:8px;padding:15px 18px;display:flex;gap:20px;align-items:center;box-shadow:0 8px 30px #26231f22;z-index:50;line-height:1.5;font-size:13px}.toast-actions{display:flex;gap:13px;flex-shrink:0}.toast button{padding:0;border:0;background:transparent;color:#fffdf9;text-decoration:underline;text-underline-offset:4px;font-size:13px}dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);width:min(460px,calc(100vw - 32px));padding:28px}dialog::backdrop{background:#201e1a50}dialog h2{font-size:20px;margin:0 0 10px}dialog p{color:var(--muted);font-size:14px;margin:0 0 20px}dialog input{width:100%;padding:11px;border:1px solid #bcb5a9;border-radius:5px;background:var(--surface);color:var(--ink);margin:0 0 20px}dialog .actions{display:flex;justify-content:flex-end;gap:9px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}.preview-explainer{color:var(--muted);font-size:12px;margin:8px 0 0}.memory-link{color:var(--muted)}
@media(max-width:700px){.app{padding:0 18px}.top{height:75px;gap:18px}.brand{font-size:24px}.nav{gap:16px}.nav button{font-size:13px}.count-pill{display:none}.preview{padding:7px 18px;font-size:11px}.preview span{max-width:75%}.content{padding-top:28px}.page-heading{align-items:flex-start;gap:12px}h1{font-size:22px}.page-heading .button{padding:9px 12px}.site-name{display:none}.tab-main{gap:10px}.tab-row{padding:5px 8px}.tab-title{font-size:13px}.close-tab{opacity:1;font-size:12px;padding:8px}.selecting .tab-main{padding:13px}.selection-checkbox{width:21px;height:21px;min-width:21px}.selection-bar-inner{flex-direction:column;align-items:stretch;gap:12px;padding:14px}.selection-actions{justify-content:flex-end}.selection-actions .button{flex:1;padding:11px 8px;font-size:13px}.selection-detail{display:none}.saved-header{gap:10px;padding:20px 0}.saved-name{font-size:14px}.saved-title{gap:9px}.record-action{font-size:12px;min-width:80px;padding:9px}.saved-body{margin-left:0;padding:0 12px}.saved-body .tab-row{gap:4px}.footer{min-height:70px;align-items:center;gap:12px;font-size:10px}.footer-links{gap:12px}.toast{bottom:86px;flex-wrap:wrap;gap:9px;width:calc(100% - 36px)}.toast-actions{margin-left:auto}.selection-bar{bottom:-24px}.active-tag{display:none}}

</style>
</head>
<body>
<div class="preview"><span><b>交互方案预览</b> · 示例数据，所有操作仅在演示中生效</span><button id="reset-demo">重置演示</button></div>
<div class="app">
<header class="top"><div class="brand">Tab Out</div><nav class="nav" aria-label="主导航"><button id="nav-open" data-view="open" aria-current="page">打开的标签页 <span class="count-pill" id="open-count"></span></button><button id="nav-saved" data-view="saved">已保存 <span class="count-pill" id="saved-count"></span></button></nav></header>
<main class="content" id="content">
<section id="view-open" aria-labelledby="open-heading"><div class="page-heading"><div><h1 id="open-heading">打开的标签页</h1><p class="subtitle" id="open-subtitle"></p></div><button class="button primary" id="select-mode">选择标签页</button></div><p class="selection-note" id="selection-note" hidden>选择模式：点击整行选择，不会切换网页。</p><div id="open-list"></div><div class="selection-bar" id="selection-bar" hidden><div class="selection-bar-inner"><div><div class="selection-total" id="selection-total">已选 0 页</div><div class="selection-detail" id="selection-detail">收起会先保存，再关闭所选网页。</div></div><div class="selection-actions"><button class="button" id="save-only" disabled>仅保存</button><button class="button primary" id="put-away" disabled>收起所选</button></div></div></div></section>
<section id="view-saved" aria-labelledby="saved-heading" hidden><div class="page-heading"><div><h1 id="saved-heading">已保存</h1><p class="subtitle">收起来的网页都在这里，打开后也会保留。</p></div></div><div class="saved-list" id="saved-list"></div></section>
</main>
<footer class="footer"><span>Tab Out 由 TinggengYan 开发 · 基于 Zara</span><span class="footer-links"><span>保存在这台设备</span><span>简化交互提案</span></span></footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden><span id="toast-message"></span><div class="toast-actions" id="toast-actions"></div></div>
<dialog id="rename-dialog"><form method="dialog" id="rename-form"><h2>重命名</h2><p>用一个方便下次找到的名字。</p><label class="sr" for="rename-input">保存记录名称</label><input id="rename-input" maxlength="100" required autocomplete="off"><div class="actions"><button class="button" type="button" id="rename-cancel">取消</button><button class="button primary" value="save">保存名称</button></div></form></dialog>
<dialog id="delete-dialog"><h2>删除这组记录？</h2><p>只删除保存记录，不会关闭正在打开的网页。演示中可撤销。</p><div class="actions"><button class="button" id="delete-cancel">取消</button><button class="button" id="delete-confirm" style="color:var(--danger)">删除记录</button></div></dialog>
<script>
(()=>{
'use strict';
const initialTabs=[
{id:'t1',title:'AI Agent 的上下文工程：如何让复杂任务持续推进',site:'少数派',domain:'sspai.com',url:'https://sspai.com/post/context-demo',window:'当前窗口'},
{id:'t2',title:'Anthropic：Building effective agents',site:'Anthropic',domain:'anthropic.com',url:'https://www.anthropic.com/research/building-effective-agents',window:'当前窗口'},
{id:'t3',title:'从原型到产品：交互设计中的「少一步」',site:'设计笔记',domain:'design.example',url:'https://design.example/less-is-more',window:'当前窗口'},
{id:'t4',title:'Tab Out · 简化交互讨论',site:'语雀',domain:'yuque.com',url:'https://www.yuque.com/demo/tab-out',window:'当前窗口'},
{id:'t5',title:'收件箱',site:'Gmail',domain:'mail.google.com',url:'https://mail.google.com/mail/u/0/',window:'当前窗口',pinned:true},
{id:'t6',title:'东京散步地图：神保町、清澄白河与代官山',site:'旅行笔记',domain:'travel.example',url:'https://travel.example/tokyo-walk',window:'另一个窗口'},
{id:'t7',title:'相机评测：轻装出门的选择',site:'相机笔记',domain:'camera.example',url:'https://camera.example/travel-camera',window:'另一个窗口'}
];
const initialSaved=[
{id:'s1',name:'周末的阅读清单',time:'今天 09:40',pages:[{id:'r1',title:'把注意力留给真正重要的事',site:'阅读',domain:'read.example',url:'https://read.example/attention'},{id:'r2',title:'让浏览器成为安静的工作台',site:'少数派',domain:'sspai.com',url:'https://sspai.com/post/workbench-demo'},{id:'r3',title:'一个人的知识管理实践',site:'笔记',domain:'notes.example',url:'https://notes.example/knowledge'}]},
{id:'s2',name:'东京旅行',time:'昨天 16:20',pages:[initialTabs[5],{id:'r4',title:'东京的小咖啡馆地图',site:'旅行笔记',domain:'travel.example',url:'https://travel.example/tokyo-coffee'}]},
{id:'s3',name:'稍后再看的技术文章',time:'11 月 9 日',pages:[initialTabs[1],{id:'r5',title:'Designing for simplicity',site:'设计笔记',domain:'design.example',url:'https://design.example/simplicity'}]}
];
const clone=v=>JSON.parse(JSON.stringify(v));let tabs=clone(initialTabs),saved=clone(initialSaved),selecting=false,selection=new Set(),view='open',expanded=new Set(),activeId='',undo=null,toastTimer,renameId='',deleteId='',dialogFocus=null;let serial=10;
const el=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function showToast(message,actions=[]){clearTimeout(toastTimer);el('toast-message').textContent=message;el('toast-actions').replaceChildren();for(const a of actions){const b=document.createElement('button');b.textContent=a.text;b.addEventListener('click',a.run);el('toast-actions').append(b)}el('toast').hidden=false;if(!actions.length)toastTimer=setTimeout(()=>{el('toast').hidden=true},3500)}
function toastOff(){clearTimeout(toastTimer);el('toast').hidden=true}
function switchView(next,focus=true){view=next;if(selecting){selecting=false;selection.clear()}render();el('content').scrollTop=0;if(focus)el(next==='open'?'nav-open':'nav-saved').focus({preventScroll:true})}
function pageMain(t,selected=false){return `<span class="site-name">${esc(t.site||'网页')}</span><span class="tab-text"><span class="title-line"><span class="tab-title">${esc(t.title)}</span>${t.pinned?'<span class="pinned-tag">固定</span>':''}${activeId===t.id?'<span class="active-tag">正在浏览</span>':''}</span><span class="tab-domain">${esc(t.domain)}</span></span>`}
function render(){
 el('open-count').textContent=tabs.length;el('saved-count').textContent=saved.length;el('view-open').hidden=view!=='open';el('view-saved').hidden=view!=='saved';
 for(const v of ['open','saved']){const n=el('nav-'+v);if(view===v)n.setAttribute('aria-current','page');else n.removeAttribute('aria-current')}
 el('view-open').classList.toggle('selecting',selecting);el('select-mode').textContent=selecting?'取消选择':'选择标签页';el('select-mode').classList.toggle('primary',!selecting);el('select-mode').disabled=!tabs.length;el('selection-note').hidden=!selecting;el('selection-bar').hidden=!selecting;
 const windows=[...new Set(tabs.map(t=>t.window))];el('open-subtitle').textContent=selecting?'选择要留下的网页，不必逐个整理。':`${tabs.length} 个网页 · ${windows.length} 个窗口`;
 el('open-list').innerHTML=windows.map(w=>{const ts=tabs.filter(t=>t.window===w);return `<section class="group" aria-label="${esc(w)}"><div class="group-header"><h2>${esc(w)}</h2><span>${ts.length} 页</span>${selecting?`<button data-select-window="${esc(w)}">${ts.every(t=>selection.has(t.id))?'取消本窗口选择':'选择本窗口'}</button>`:''}</div>${ts.map(t=>`<div class="tab-row" data-row="${t.id}"><button class="tab-main" data-tab="${t.id}" ${selecting?`aria-pressed="${selection.has(t.id)}" aria-label="${selection.has(t.id)?'取消选择':'选择'} ${esc(t.title)}"`:''}>${selecting?`<input class="selection-checkbox" type="checkbox" ${selection.has(t.id)?'checked':''} tabindex="-1" aria-hidden="true">`:''}${pageMain(t)}</button>${selecting?'':`<button class="text-button close-tab" data-close="${t.id}" aria-label="关闭 ${esc(t.title)}">关闭</button>`}</div>`).join('')}</section>`}).join('')||'<div class="empty"><h2>桌面清空了。</h2><p>之前收起的网页，可以随时从“已保存”重新打开。</p><button class="button" data-go-saved>查看已保存</button></div>';
 const picked=tabs.filter(t=>selection.has(t.id)),pinned=picked.filter(t=>t.pinned).length;el('selection-total').textContent=`已选 ${picked.length} 页`;el('selection-detail').textContent=pinned?`其中 ${pinned} 个固定标签会保存并保持打开。`:'收起会先保存，再关闭所选网页。';el('put-away').disabled=el('save-only').disabled=!picked.length;el('put-away').textContent=pinned?`保存并收起 ${picked.length-pinned} 页`:`收起所选 ${picked.length} 页`;
 el('saved-list').innerHTML=saved.map(s=>{const open=expanded.has(s.id),openUrls=new Set(tabs.map(t=>t.url)),opened=s.pages.filter(p=>openUrls.has(p.url)).length;return `<article class="saved-record" data-saved="${s.id}"><div class="saved-header"><button class="saved-title" data-expand="${s.id}" aria-expanded="${open}" aria-controls="body-${s.id}"><span class="chevron" data-open="${open}" aria-hidden="true">›</span><span><span class="saved-name">${esc(s.name)}</span><span class="saved-meta">${s.pages.length} 个网页<span class="divider">·</span>${esc(s.time)}${opened?`<span class="divider">·</span>${opened} 页已打开`:''}</span></span></button><button class="button record-action" data-open-saved="${s.id}">${opened===s.pages.length?'切换到网页':'打开这组网页'}</button></div><div class="saved-body" id="body-${s.id}" ${open?'':'hidden'}>${s.pages.map(p=>`<div class="tab-row"><button class="tab-main" data-open-page="${s.id}" data-page-url="${esc(p.url)}">${pageMain(p)}</button><button class="text-button" data-remove-page="${s.id}" data-page-url="${esc(p.url)}" aria-label="移出保存记录：${esc(p.title)}">移除</button></div>`).join('')}<div class="record-tools"><button class="text-button" data-rename="${s.id}">重命名</button><button class="text-button" data-delete="${s.id}">删除这组记录</button></div></div></article>`}).join('')||'<div class="empty"><h2>还没有保存的网页。</h2><p>在“打开的标签页”中，选择几页试着收起来。</p><button class="button" data-go-open>去选择标签页</button></div>';
}
function toggle(id){if(selection.has(id))selection.delete(id);else selection.add(id);render();document.querySelector(`[data-tab="${id}"]`)?.focus({preventScroll:true})}
function savePicked(close){const picked=tabs.filter(t=>selection.has(t.id));if(!picked.length)return;const before={tabs:clone(tabs),saved:clone(saved)};const id='s'+(++serial),name=picked[0].title+(picked.length>1?` 等 ${picked.length} 页`:'');saved.unshift({id,name,time:'刚刚',pages:clone(picked)});let closed=0;if(close){tabs=tabs.filter(t=>{const remove=selection.has(t.id)&&!t.pinned;if(remove)closed++;return !remove})}undo=()=>{tabs=before.tabs;saved=before.saved;selecting=false;selection.clear();render();showToast('已撤销，网页和保存记录已恢复。')};selecting=false;selection.clear();render();el('select-mode').disabled?el('nav-open').focus():el('select-mode').focus();const pinned=picked.filter(t=>t.pinned).length;showToast(close?`已保存 ${picked.length} 页，并关闭 ${closed} 页${pinned?`；${pinned} 个固定标签保留`:'。'}`:`已保存 ${picked.length} 页，网页保持打开。`,[{text:'查看',run:()=>{expanded.add(id);switchView('saved');document.querySelector(`[data-expand="${id}"]`)?.focus();toastOff()}},{text:'撤销',run:()=>{undo?.();undo=null}}])}
function openPages(pages){let added=0,reused=0;for(const p of pages){const found=tabs.find(t=>t.url===p.url);if(found){activeId=found.id;reused++}else{const t={...clone(p),id:'t'+(++serial),window:'当前窗口'};tabs.push(t);activeId=t.id;added++}}render();showToast(added?`已打开 ${added} 个网页${reused?`，复用 ${reused} 个已打开网页`:''}。保存记录仍然保留。`:`${reused} 个网页已打开，已切换到对应网页（演示）。`)}
el('nav-open').onclick=()=>switchView('open');el('nav-saved').onclick=()=>switchView('saved');el('select-mode').onclick=()=>{selecting=!selecting;selection.clear();render();if(selecting)el('selection-note').scrollIntoView({block:'nearest'});el('select-mode').focus({preventScroll:true})};el('save-only').onclick=()=>savePicked(false);el('put-away').onclick=()=>savePicked(true);
el('content').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.tab){if(selecting)toggle(d.tab);else{activeId=d.tab;render();showToast('已切换到“'+tabs.find(t=>t.id===d.tab).title+'”（演示）。');document.querySelector(`[data-tab="${d.tab}"]`)?.focus({preventScroll:true})}}
 else if(d.selectWindow){const ids=tabs.filter(t=>t.window===d.selectWindow).map(t=>t.id),all=ids.every(id=>selection.has(id));for(const id of ids)all?selection.delete(id):selection.add(id);render();document.querySelector(`[data-select-window="${d.selectWindow}"]`)?.focus({preventScroll:true})}
 else if(d.close){const old=clone(tabs);tabs=tabs.filter(t=>t.id!==d.close);render();showToast('已关闭 1 个网页。',[{text:'撤销',run:()=>{tabs=old;render();showToast('网页已恢复。')}}])}
 else if(d.expand){expanded.has(d.expand)?expanded.delete(d.expand):expanded.add(d.expand);render();document.querySelector(`[data-expand="${d.expand}"]`)?.focus({preventScroll:true})}
 else if(d.openSaved){const s=saved.find(s=>s.id===d.openSaved);openPages(s.pages);document.querySelector(`[data-open-saved="${d.openSaved}"]`)?.focus({preventScroll:true})}
 else if(d.openPage){openPages(saved.find(s=>s.id===d.openPage).pages.filter(p=>p.url===d.pageUrl));document.querySelector(`[data-open-page="${d.openPage}"][data-page-url="${CSS.escape(d.pageUrl)}"]`)?.focus({preventScroll:true})}
 else if(d.removePage){const before=clone(saved),s=saved.find(s=>s.id===d.removePage);s.pages=s.pages.filter(p=>p.url!==d.pageUrl);if(!s.pages.length)saved=saved.filter(x=>x.id!==s.id);render();showToast('已移除保存链接，打开的网页不受影响。',[{text:'撤销',run:()=>{saved=before;render();showToast('保存链接已恢复。')}}]);document.querySelector(`[data-expand="${s.id}"]`)?.focus({preventScroll:true})}
 else if(d.rename){renameId=d.rename;dialogFocus=b;el('rename-input').value=saved.find(s=>s.id===renameId).name;el('rename-dialog').showModal();el('rename-input').select()}
 else if(d.delete){deleteId=d.delete;dialogFocus=b;el('delete-dialog').showModal();el('delete-cancel').focus()}
 else if('goSaved'in d)switchView('saved');else if('goOpen'in d)switchView('open');
});
el('rename-form').addEventListener('submit',e=>{const name=el('rename-input').value.trim();if(!name){e.preventDefault();return}saved.find(s=>s.id===renameId).name=name;render();el('rename-dialog').close();document.querySelector(`[data-rename="${renameId}"]`)?.focus({preventScroll:true});showToast('名称已更新。')});el('rename-cancel').onclick=()=>{el('rename-dialog').close();dialogFocus?.focus()};el('delete-cancel').onclick=()=>{el('delete-dialog').close();dialogFocus?.focus()};el('delete-confirm').onclick=()=>{const before=clone(saved);saved=saved.filter(s=>s.id!==deleteId);el('delete-dialog').close();render();el('nav-saved').focus();showToast('已删除保存记录，打开的网页不受影响。',[{text:'撤销',run:()=>{saved=before;render();showToast('保存记录已恢复。')}}])};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&selecting&&!document.querySelector('dialog[open]')){selecting=false;selection.clear();render();el('select-mode').focus();toastOff()}});el('reset-demo').onclick=()=>{tabs=clone(initialTabs);saved=clone(initialSaved);selection.clear();expanded.clear();selecting=false;view='open';activeId='';undo=null;toastOff();render();el('content').scrollTop=0;el('select-mode').focus()};
render();
})();
</script>
</body>
</html>
