<!DOCTYPE html>
<html lang="en" id="htmlRoot">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab Out</title>

  <link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="src/ui/search-platform-settings.css">
  <link rel="stylesheet" href="src/ui/project-workbench.css">
  <link rel="stylesheet" href="src/ui/browsing-memory.css">
  <link rel="stylesheet" href="src/ui/dashboard-navigation.css">
</head>
<body>
<div class="page-wrapper">

<!-- ================================================================
     SHORTCUTS SIDEBAR — custom bookmarks on the left
     ================================================================ -->
<nav class="shortcuts-sidebar" id="shortcutsSidebar">
  <div class="shortcuts-list" id="shortcutsList"></div>
  <button class="shortcut-add-btn" id="shortcutAddBtn" title="">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
  </button>
  <div class="shortcut-io-group">
    <button class="shortcut-io-btn" id="shortcutExportBtn" title="">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5" /></svg>
    </button>
    <button class="shortcut-io-btn" id="shortcutImportBtn" title="">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3" /></svg>
    </button>
    <input type="file" id="shortcutImportFile" accept=".json,.config,application/json" style="display:none">
  </div>
</nav>

<!-- Custom context menu for shortcuts -->
<div class="shortcut-ctx-menu" id="shortcutCtxMenu" style="display:none">
  <button class="ctx-menu-item" data-ctx-action="edit" id="ctxEdit"></button>
  <button class="ctx-menu-item ctx-menu-danger" data-ctx-action="delete" id="ctxDelete"></button>
</div>

<!-- Add/Edit shortcut dialog -->
<div class="shortcut-dialog-overlay" id="shortcutDialogOverlay" style="display:none">
  <div class="shortcut-dialog">
    <div class="shortcut-dialog-field">
      <label id="dialogNameLabel"></label>
      <input type="text" id="dialogName" autocomplete="off">
    </div>
    <div class="shortcut-dialog-field">
      <label id="dialogUrlLabel"></label>
      <input type="url" id="dialogUrl" placeholder="https://" autocomplete="off">
    </div>
    <div class="shortcut-dialog-actions">
      <button class="shortcut-dialog-btn cancel" id="dialogCancel"></button>
      <button class="shortcut-dialog-btn save" id="dialogSave"></button>
    </div>
  </div>
</div>

<div class="container">

  <nav class="dashboard-navigation" id="dashboardNavigation" aria-label="Dashboard views">
    <span class="dashboard-brand">Tab Out</span>
    <div class="dashboard-navigation-actions">
      <button type="button" id="dashboardNavTabs" aria-controls="dashboardTabsView" aria-current="page">Tabs</button>
      <button type="button" id="dashboardNavProjects" aria-controls="dashboardProjectsView">Projects</button>
      <button type="button" id="dashboardNavMemory" aria-controls="dashboardMemoryView">Browsing memory</button>
    </div>
  </nav>

  <main class="dashboard-content" id="dashboardContent" tabindex="0" aria-labelledby="dashboardNavTabs">
  <section class="dashboard-view" id="dashboardTabsView" aria-labelledby="dashboardNavTabs">
  <!-- ================================================================
       TAB OUT DUPES BANNER — appears when you have extra Tab Out tabs open
       Hidden by default; app.js shows it when dupeTabOutCount > 1
       ================================================================ -->
  <div class="tab-cleanup-banner" id="tabOutDupeBanner" style="display:none">
    <div class="tab-cleanup-left">
      <div class="tab-cleanup-icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 0 1-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 0 1 1.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 0 0-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 0 1-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 0 0-3.375-3.375h-1.5a1.125 1.125 0 0 1-1.125-1.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H9.75" />
        </svg>
      </div>
      <div class="tab-cleanup-text" id="tabOutDupeText"></div>
    </div>
    <button class="tab-cleanup-btn" data-action="close-tabout-dupes" id="closeExtrasBtn"></button>
  </div>

  <!-- ================================================================
       MAIN CONTENT AREA — two-column layout
       Left: open tabs (domain/mission cards)
       Right: saved for later checklist
       The right column only renders when it has items (JS controls this)
       ================================================================ -->
  <div class="dashboard-columns" id="dashboardColumns">

    <!-- LEFT COLUMN: Open tabs -->
    <div class="active-section" id="openTabsSection" style="display:none">
      <div class="section-header">
        <h2 id="openTabsSectionTitle"></h2>
        <div class="section-line"></div>
        <div class="section-count" id="openTabsSectionCount"></div>
      </div>
      <div class="tabs-selection-toolbar" id="tabsSelectionToolbar" hidden><span id="tabsSelectionSummary" role="status" aria-live="polite"></span><div><button class="project-button project-button-primary" id="tabsSelectionSaveBtn" data-action="save-selected-tabs"></button><button class="project-button" id="tabsSelectionClearBtn" data-action="clear-selected-tabs"></button></div></div>
      <p class="tabs-selection-hint" id="tabsSelectionHint"></p><div class="missions" id="openTabsMissions"></div>
    </div>

    <!-- RIGHT COLUMN: Saved for Later checklist -->
    <div class="deferred-column" id="deferredColumn" style="display:none">
      <div class="section-header">
        <h2 id="deferredTitle"></h2>
        <div class="section-line"></div>
        <div class="section-count" id="deferredCount"></div>
      </div>

      <!-- Active checklist items — injected by renderDeferredList() in app.js -->
      <div class="deferred-list" id="deferredList"></div>

      <!-- Empty state — shown when no active deferred tabs -->
      <div class="deferred-empty" id="deferredEmpty" style="display:none">
        <span id="deferredEmptyText"></span>
      </div>

      <!-- Archive section — collapsed by default -->
      <div class="deferred-archive" id="deferredArchive" style="display:none">
        <button class="archive-toggle" id="archiveToggle">
          <svg class="archive-chevron" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" /></svg>
          <span id="archiveLabel"></span>
          <span class="archive-count" id="archiveCount"></span>
        </button>
        <div class="archive-body" id="archiveBody" style="display:none">
          <input type="text" class="archive-search" id="archiveSearch" placeholder="">
          <div class="archive-list" id="archiveList"></div>
        </div>
      </div>
    </div>



  </div><!-- end .dashboard-columns -->
  </section>

  <section class="dashboard-view" id="dashboardProjectsView" aria-labelledby="dashboardNavProjects" hidden>
  <section class="project-workbench" id="projectWorkbench" aria-labelledby="projectHeading">
    <div class="project-workbench-header">
      <div class="project-workbench-copy"><p class="project-eyebrow" id="projectEyebrow"></p><h1 id="projectHeading"></h1><p class="project-intro" id="projectIntro"></p></div>
      <div class="project-main-actions"><button class="project-button project-button-quiet" id="projectSaveBtn" type="button"></button></div>
    </div>
    <div class="project-section-heading"><h2 id="projectListTitle"></h2><span id="projectListCount"></span><span class="project-window-summary" id="projectWindowSummary"></span></div>
    <section class="project-detail" id="projectDetail" hidden aria-labelledby="projectDetailTitle"><button class="project-button project-button-quiet" id="projectDetailBackBtn"></button><div class="project-detail-heading"><div><h2 id="projectDetailTitle"></h2><p id="projectDetailSummary"></p></div><button class="project-button project-button-primary" id="projectDetailResumeBtn"></button></div><div class="project-detail-actions"><button class="project-button" id="projectDetailAddBtn"></button><details><summary id="projectDetailMore"></summary><button class="project-button" id="projectDetailReplaceBtn"></button></details></div><p id="projectDetailStatus" role="status" aria-live="polite"></p><div id="projectDetailEntries"></div></section>
    <div class="project-list" id="projectList"></div>
    <div class="project-empty" id="projectEmpty"><h3 id="projectEmptyTitle"></h3><p id="projectEmptyText"></p></div>
    <details class="saved-secondary" id="savedLater"><summary id="savedLaterTitle"></summary><div class="project-list" id="savedLaterList"></div><details class="saved-archive" id="savedArchive"><summary id="savedArchiveTitle"></summary><div class="project-list" id="savedArchiveList"></div></details></details>
    <button class="project-button project-button-quiet" id="projectAdvancedBtn" data-action="open-workspaces"></button>
    <div class="project-backup"><div><h3 id="projectBackupTitle"></h3><p id="projectBackupText"></p><span id="projectBackupStatus"></span></div><button class="project-button project-button-quiet" id="projectBackupBtn" type="button"></button></div>
    <p class="project-main-status" id="projectMainStatus" role="status" aria-live="polite"></p>
  </section>
  </section>

  <section class="dashboard-view" id="dashboardMemoryView" aria-labelledby="dashboardNavMemory" hidden>
  <section class="memory-workbench" id="memoryWorkbench" aria-labelledby="memoryHeading">
    <div class="memory-heading-row">
      <div><p class="memory-eyebrow" id="memoryEyebrow"></p><h2 id="memoryHeading"></h2><p class="memory-intro" id="memoryIntro"></p></div>
      <span class="memory-recording-state" id="memoryRecordingState"></span>
    </div>
    <form id="memorySearchForm" class="memory-search-form">
      <label class="memory-query-field"><span class="memory-sr-only" id="memoryQueryLabel"></span><input id="memoryQuery" type="search" maxlength="2000" autocomplete="off"></label>
      <label class="memory-filter-field"><span class="memory-sr-only" id="memoryTimeLabel"></span><select id="memoryDays"><option value="7" id="memoryDays7"></option><option value="30" id="memoryDays30" selected></option><option value="90" id="memoryDays90"></option></select></label>
      <label class="memory-filter-field"><span class="memory-sr-only" id="memoryModeLabel"></span><select id="memoryUseAI"><option value="local" id="memoryLocalOption"></option><option value="ai" id="memoryAIOption"></option></select></label>
      <button class="memory-button memory-button-primary" id="memorySearchBtn" type="submit"></button>
    </form>
    <label class="memory-content-consent" id="memoryContentConsent" hidden><input type="checkbox" id="memoryIncludeContent"><span id="memoryIncludeContentLabel"></span></label>
    <p class="memory-hint" id="memoryPrivacyHint" hidden></p>
    <div class="memory-overview"><span id="memoryStats"></span><button type="button" class="memory-text-button" id="memoryRefreshBtn"></button></div>
    <p class="memory-status" id="memoryStatus" role="status" aria-live="polite"></p>
    <ul class="memory-warnings" id="memoryWarnings" hidden></ul>
    <div class="memory-results-toolbar" id="memoryResultsToolbar" hidden>
      <div><span id="memoryResultCount"></span><span id="memorySelection"></span></div>
      <div class="memory-result-actions"><button type="button" class="memory-button" id="memorySelectAllBtn"></button><button type="button" class="memory-button" id="memoryOpenBtn"></button><button type="button" class="memory-button" id="memorySaveBtn"></button><button type="button" class="memory-button" id="memorySummaryBtn"></button><button type="button" class="memory-button memory-danger" id="memoryDeleteBtn"></button></div>
    </div>
    <p class="memory-hint" id="memoryCoverageHint" hidden></p>
    <section class="memory-summary" id="memorySummary" hidden aria-labelledby="memorySummaryTitle"><h3 id="memorySummaryTitle"></h3><p class="memory-hint" id="memorySummaryHint"></p><ul id="memorySummaryList"></ul></section>
    <div class="memory-results" id="memoryResults"></div>
    <div class="memory-empty" id="memoryEmpty"><h3 id="memoryEmptyTitle"></h3><p id="memoryEmptyText"></p></div>
    <details class="memory-settings" id="memorySettings">
      <summary id="memorySettingsToggle"></summary>
      <div class="memory-settings-grid">
        <section class="memory-setting-section">
          <h3 id="memoryRecordingTitle"></h3><p class="memory-hint" id="memoryCaptureHint"></p>
          <button type="button" class="memory-button" id="memoryRecordingBtn"></button>
          <button type="button" class="memory-button" id="memoryHistoryBtn"></button><p class="memory-hint" id="memoryHistoryHint"></p>
          <label class="memory-field"><span id="memoryRetentionLabel"></span><select id="memoryRetention"><option value="30" id="memoryRetention30"></option><option value="90" id="memoryRetention90" selected></option><option value="180" id="memoryRetention180"></option></select></label>
          <label class="memory-field"><span id="memoryExclusionsLabel"></span><textarea id="memoryExclusions" rows="3" maxlength="8000" autocomplete="off" spellcheck="false"></textarea></label><p class="memory-hint" id="memoryExclusionsHint"></p><p class="memory-hint" id="memoryCapacity"></p>
        </section>
        <section class="memory-setting-section">
          <h3 id="memoryModelTitle"></h3>
          <label class="memory-field"><span id="memoryBaseUrlLabel"></span><input id="memoryBaseUrl" type="url" maxlength="2048" autocomplete="off" spellcheck="false"></label>
          <label class="memory-field"><span id="memoryModelLabel"></span><input id="memoryModel" type="text" maxlength="256" autocomplete="off" spellcheck="false"></label>
          <label class="memory-field"><span id="memoryApiKeyLabel"></span><input id="memoryApiKey" type="password" maxlength="4096" autocomplete="new-password" spellcheck="false"></label><p class="memory-hint" id="memoryKeyState"></p>
          <div class="memory-inline-actions"><button type="button" class="memory-button memory-button-primary" id="memorySaveSettingsBtn"></button><button type="button" class="memory-button" id="memoryTestBtn"></button></div>
        </section>
        <section class="memory-setting-section memory-data-section">
          <h3 id="memoryDataTitle"></h3><p class="memory-hint" id="memoryBackupHint"></p>
          <div class="memory-inline-actions"><button type="button" class="memory-button" id="memoryExportBtn"></button><label class="memory-button memory-import-label"><span id="memoryImportLabel"></span><input type="file" id="memoryImportFile" accept=".json,application/json"></label><button type="button" class="memory-button memory-danger" id="memoryClearBtn"></button></div>
          <div class="memory-import-preview" id="memoryImportPreview" hidden><p id="memoryImportSummary"></p><div class="memory-inline-actions"><button type="button" class="memory-button memory-button-primary" id="memoryImportConfirmBtn"></button><button type="button" class="memory-button" id="memoryImportCancelBtn"></button></div></div>
        </section>
      </div>
    </details>
  </section>
  </section>

  </main>

  <!-- ================================================================
       FOOTER — shared tools outside the scrolling content
       ================================================================ -->
  <footer id="dashboardFooter">
    <div class="last-refresh">
      <span style="color: var(--muted); font-size: 11px;"><span id="dashboardCredit">Tab Out by TinggengYan · Based on</span> <a href="https://x.com/zarazhangrui" target="_top" style="color: var(--muted); text-decoration: underline; text-underline-offset: 2px;">Zara</a></span>
    </div>
    <div class="footer-tools">
      <button class="footer-tool-btn" id="searchOpenBtn" data-action="open-command"></button>
      <button class="footer-tool-btn" id="cleanupOpenBtn" data-action="open-cleanup"></button>
      <button class="footer-tool-btn" id="workspacesOpenBtn" data-action="open-workspaces"></button>
      <button class="footer-tool-btn" id="historyOpenBtn" data-action="open-history"></button>
      <button class="footer-tool-btn" id="trashOpenBtn" data-action="open-trash"></button>
      <button class="footer-tool-btn" id="settingsOpenBtn" data-action="open-settings"></button>

    </div>
  </footer>

</div><!-- end .container -->
</div><!-- end .page-wrapper -->

<div class="modal-overlay" id="trashOverlay" style="display:none">
  <section class="trash-dialog" role="dialog" aria-modal="true" aria-labelledby="trashTitle">
    <div class="trash-dialog-header">
      <div>
        <h2 id="trashTitle"></h2>
        <p id="trashSubtitle"></p>
      </div>
      <button class="trash-close" data-action="close-trash" aria-label="Close" data-i18n-aria="common.close">&times;</button>
    </div>
    <div class="trash-list" id="trashList"></div>
    <div class="trash-empty" id="trashEmpty"></div>
    <div class="trash-dialog-footer">
      <button class="action-btn danger" data-action="clear-trash" id="trashClearBtn"></button>
    </div>
  </section>
</div>

<div class="modal-overlay" id="historyOverlay" style="display:none">
  <section class="trash-dialog history-dialog" role="dialog" aria-modal="true" aria-labelledby="historyTitle">
    <div class="trash-dialog-header">
      <div>
        <h2 id="historyTitle"></h2>
        <p id="historySubtitle"></p>
      </div>
      <button class="trash-close" data-action="close-history" aria-label="Close" data-i18n-aria="common.close">&times;</button>
    </div>
    <div class="history-toolbar">
      <button class="action-btn primary" data-action="save-snapshot" id="saveSnapshotBtn"></button>
    </div>
    <div class="trash-list" id="historyList"></div>
    <div class="trash-empty" id="historyEmpty"></div>
    <h3 class="history-subheading" id="operationHistoryTitle"></h3>
    <div class="trash-list operation-history-list" id="operationHistoryList"></div>
    <div class="trash-empty" id="operationHistoryEmpty"></div>
  </section>
</div>

<div class="modal-overlay" id="workspacesOverlay" style="display:none">
  <section class="trash-dialog workspace-dialog" role="dialog" aria-modal="true" aria-labelledby="workspacesTitle">
    <div class="trash-dialog-header">
      <div><h2 id="workspacesTitle"></h2><p id="workspacesSubtitle"></p></div>
      <button class="trash-close" data-action="close-workspaces" aria-label="Close" data-i18n-aria="common.close">&times;</button>
    </div>
    <div class="history-toolbar">
      <select class="workspace-template-select" id="workspaceTemplateSelect"></select>
      <button class="action-btn" data-action="create-from-template" id="createTemplateBtn"></button>
      <button class="action-btn primary" data-action="save-current-workspace" id="saveWorkspaceBtn"></button>
    </div>
    <div class="workspace-list" id="workspaceList"></div>
    <div class="trash-empty" id="workspaceEmpty"></div>
    <div class="workspace-automation" id="workspaceAutomation">
      <h3 id="workspaceSuggestionsTitle"></h3><div id="workspaceSuggestions"></div>
      <h3 id="workspaceRulesTitle"></h3><div id="workspaceRules"></div>
      <div class="workspace-exclusion-editor"><input id="workspaceRuleExclusionInput"><button class="action-btn" data-action="add-rule-exclusion" id="workspaceRuleExclusionBtn"></button></div>
      <div id="workspaceRuleExclusions"></div>
    </div>
  </section>
</div>

<div class="modal-overlay" id="onboardingOverlay" style="display:none">
  <section class="onboarding-dialog" role="dialog" aria-modal="true" aria-labelledby="onboardingTitle">
    <div class="onboarding-kicker">TAB OUT</div>
    <h1 id="onboardingTitle"></h1>
    <p class="onboarding-lead" id="onboardingLead"></p>
    <div class="onboarding-steps">
      <article class="onboarding-step"><span>1</span><h3 id="onboardingStep1Title"></h3><p id="onboardingStep1Text"></p></article>
      <article class="onboarding-step"><span>2</span><h3 id="onboardingStep2Title"></h3><p id="onboardingStep2Text"></p></article>
      <article class="onboarding-step"><span>3</span><h3 id="onboardingStep3Title"></h3><p id="onboardingStep3Text"></p></article>
    </div>
    <div class="onboarding-privacy">
      <strong id="onboardingPrivacyTitle"></strong>
      <p id="onboardingPrivacyText"></p>
    </div>
    <button class="action-btn primary onboarding-start" data-action="finish-onboarding" id="onboardingStartBtn"></button>
  </section>
</div>

<div class="modal-overlay" id="restoreOverlay" style="display:none">
  <section class="restore-dialog" role="dialog" aria-modal="true" aria-labelledby="restoreTitle">
    <div class="trash-dialog-header">
      <div><h2 id="restoreTitle"></h2><p id="restoreSummary"></p></div>
      <button class="trash-close" data-action="cancel-restore" aria-label="Close" data-i18n-aria="common.close">&times;</button>
    </div>
    <div class="restore-options">
      <label><input type="radio" name="restoreMode" value="new-window" checked><span id="restoreModeNew"></span></label>
      <label><input type="radio" name="restoreMode" value="merge"><span id="restoreModeMerge"></span></label>
      <label><input type="radio" name="restoreMode" value="replace-current"><span id="restoreModeReplace"></span></label>
      <label class="restore-checkbox"><input type="checkbox" id="restoreSkipDuplicates" checked><span id="restoreSkipText"></span></label>
    </div>
    <div class="restore-warning" id="restoreWarning"></div>
    <div class="restore-footer">
      <button class="action-btn" data-action="cancel-restore" id="restoreCancelBtn"></button>
      <button class="action-btn primary" data-action="confirm-restore" id="restoreConfirmBtn"></button>
    </div>
  </section>
</div>

<div class="command-overlay" id="commandOverlay" style="display:none">
  <section class="command-dialog" role="dialog" aria-modal="true" aria-label="Search" data-i18n-aria="search.open">
    <div class="command-input-row">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-4.35-4.35m2.1-5.4a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z" /></svg>
      <input id="commandInput" autocomplete="off">
      <kbd>ESC</kbd>
    </div>
    <div class="command-toolbar"><span id="commandHint"></span><button class="action-btn" id="platformSettingsBtn" data-action="open-platform-settings"></button></div>
    <div class="command-results" id="commandResults"></div>
    <div class="command-empty" id="commandEmpty"></div>
  </section>
</div>

<div class="modal-overlay" id="cleanupOverlay" style="display:none">
  <section class="trash-dialog cleanup-dialog" role="dialog" aria-modal="true" aria-labelledby="cleanupTitle">
    <div class="trash-dialog-header">
      <div><h2 id="cleanupTitle"></h2><p id="cleanupSubtitle"></p></div>
      <button class="trash-close" data-action="close-cleanup" aria-label="Close" data-i18n-aria="common.close">&times;</button>
    </div>
    <div class="cleanup-summary" id="cleanupSummary"></div>
    <div class="cleanup-list" id="cleanupList"></div>
    <div class="cleanup-whitelist">
      <input id="cleanupWhitelistInput"><button class="action-btn" data-action="add-cleanup-whitelist" id="cleanupWhitelistBtn"></button>
    </div>
    <div class="restore-footer"><button class="action-btn danger" data-action="apply-cleanup" id="cleanupApplyBtn"></button></div>
  </section>
</div>

<div class="modal-overlay" id="upgradeOverlay" style="display:none">
  <section class="upgrade-dialog" role="dialog" aria-modal="true" aria-labelledby="upgradeTitle">
    <button class="trash-close upgrade-close" data-action="close-upgrade" aria-label="Close" data-i18n-aria="common.close">&times;</button>
    <div class="onboarding-kicker">TAB OUT</div><h2 id="upgradeTitle"></h2><p id="upgradeSubtitle"></p>
    <div class="upgrade-plans">
      <article id="proLifetimeOffer" hidden><h3 id="proLifetimeTitle"></h3><div class="upgrade-price">$29</div><p id="proLifetimeText"></p><button class="action-btn primary" data-action="start-checkout" data-plan="pro_lifetime" id="buyLifetimeBtn"></button></article>
      <article id="syncOffer" hidden><h3 id="syncPlanTitle"></h3><div class="upgrade-price">$24<span id="upgradePerYear">/yr</span></div><p id="syncPlanText"></p><button class="action-btn primary" data-action="start-checkout" data-plan="sync" id="buySyncBtn"></button></article>
