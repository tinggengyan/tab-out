<!DOCTYPE html>
<html lang="en" id="htmlRoot">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab Out</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page-wrapper">

<!-- ================================================================
     SHORTCUTS SIDEBAR — custom bookmarks on the left
     ================================================================ -->
<nav class="shortcuts-sidebar" id="shortcutsSidebar">
  <div class="shortcuts-list" id="shortcutsList"></div>
  <button class="shortcut-add-btn" id="shortcutAddBtn" title="">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
  </button>
  <div class="shortcut-io-group">
    <button class="shortcut-io-btn" id="shortcutExportBtn" title="">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5" /></svg>
    </button>
    <button class="shortcut-io-btn" id="shortcutImportBtn" title="">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3" /></svg>
    </button>
    <input type="file" id="shortcutImportFile" accept=".json,.config,application/json" style="display:none">
  </div>
</nav>

<!-- Custom context menu for shortcuts -->
<div class="shortcut-ctx-menu" id="shortcutCtxMenu" style="display:none">
  <button class="ctx-menu-item" data-ctx-action="edit" id="ctxEdit"></button>
  <button class="ctx-menu-item ctx-menu-danger" data-ctx-action="delete" id="ctxDelete"></button>
</div>

<!-- Add/Edit shortcut dialog -->
<div class="shortcut-dialog-overlay" id="shortcutDialogOverlay" style="display:none">
  <div class="shortcut-dialog">
    <div class="shortcut-dialog-field">
      <label id="dialogNameLabel"></label>
      <input type="text" id="dialogName" autocomplete="off">
    </div>
    <div class="shortcut-dialog-field">
      <label id="dialogUrlLabel"></label>
      <input type="url" id="dialogUrl" placeholder="https://" autocomplete="off">
    </div>
    <div class="shortcut-dialog-actions">
      <button class="shortcut-dialog-btn cancel" id="dialogCancel"></button>
      <button class="shortcut-dialog-btn save" id="dialogSave"></button>
    </div>
  </div>
</div>

<div class="container">



  <!-- ================================================================
       TAB OUT DUPES BANNER — appears when you have extra Tab Out tabs open
       Hidden by default; app.js shows it when dupeTabOutCount > 1
       ================================================================ -->
  <div class="tab-cleanup-banner" id="tabOutDupeBanner" style="display:none">
    <div class="tab-cleanup-left">
      <div class="tab-cleanup-icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 0 1-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 0 1 1.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 0 0-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 0 1-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 0 0-3.375-3.375h-1.5a1.125 1.125 0 0 1-1.125-1.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H9.75" />
        </svg>
      </div>
      <div class="tab-cleanup-text" id="tabOutDupeText"></div>
    </div>
    <button class="tab-cleanup-btn" data-action="close-tabout-dupes" id="closeExtrasBtn"></button>
  </div>

  <!-- ================================================================
       MAIN CONTENT AREA — two-column layout
       Left: open tabs (domain/mission cards)
       Right: saved for later checklist
       The right column only renders when it has items (JS controls this)
       ================================================================ -->
  <div class="dashboard-columns" id="dashboardColumns">

    <!-- LEFT COLUMN: Open tabs -->
    <div class="active-section" id="openTabsSection" style="display:none">
      <div class="section-header">
        <h2 id="openTabsSectionTitle"></h2>
        <!-- The one search entry on the page; "/" opens the same overlay -->
        <button class="search-trigger" id="searchTrigger" type="button" aria-keyshortcuts="/">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" /></svg><span id="searchTriggerLabel"></span><kbd>/</kbd>
        </button>
        <div class="section-line"></div>
        <div class="section-count" id="openTabsSectionCount"></div>
      </div>
      <div class="missions" id="openTabsMissions"></div>
    </div>

    <!-- RIGHT COLUMN: stash ("已收纳") above save-for-later; hidden when both are empty -->
    <aside class="side-column" id="sideColumn" hidden>
      <!-- RIGHT COLUMN: Saved for Later checklist — on top, so a long stash cannot push it off screen -->
      <div class="deferred-column" id="deferredColumn" style="display:none">
        <div class="section-header">
          <h2 id="deferredTitle"></h2>
          <div class="section-line"></div>
          <div class="section-count" id="deferredCount"></div>
        </div>

        <!-- Active checklist items — injected by renderDeferredList() in app.js -->
        <div class="deferred-list" id="deferredList"></div>

        <!-- Empty state — shown when no active deferred tabs -->
        <div class="deferred-empty" id="deferredEmpty" style="display:none">
          <span id="deferredEmptyText"></span>
        </div>

        <!-- Archive section — collapsed by default -->
        <div class="deferred-archive" id="deferredArchive" style="display:none">
          <button class="archive-toggle" id="archiveToggle">
            <svg class="archive-chevron" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" /></svg>
            <span id="archiveLabel"></span>
            <span class="archive-count" id="archiveCount"></span>
          </button>
          <div class="archive-body" id="archiveBody" style="display:none">
            <input type="text" class="archive-search" id="archiveSearch" placeholder="">
            <div class="archive-list" id="archiveList"></div>
          </div>
        </div>
      </div>

      <!-- RIGHT COLUMN: Stash ("已收纳") — below save-for-later, one compact row per record -->
      <div class="tab-groups-column" id="tabGroupsColumn" style="display:none">
        <div class="section-header">
          <h2 id="tabGroupsTitle"></h2>
          <div class="section-line"></div>
          <div class="section-count" id="tabGroupsCount"></div>
        </div>
        <div class="tab-groups-list" id="tabGroupsList"></div>
        <div class="tab-groups-empty" id="tabGroupsEmpty" style="display:none">
          <span id="tabGroupsEmptyText"></span>
        </div>
      </div>
    </aside>

  </div><!-- end .dashboard-columns -->

  <!-- ================================================================
       FOOTER — global stats + refresh control
       ================================================================ -->
  <footer>
    <div class="last-refresh">
      <span style="color: var(--muted); font-size: 11px;">Tab Out by TinggengYan based on <a href="https://x.com/zarazhangrui" target="_top" style="color: var(--muted); text-decoration: underline; text-underline-offset: 2px;">Zara</a></span>
    </div>
  </footer>

</div><!-- end .container -->
</div><!-- end .page-wrapper -->

<!-- ================================================================
     SEARCH — one overlay over open tabs, saved for later, stash and,
     once granted, bookmarks and history. Hidden until opened; app.js
     fills the message, results, grant card and footer.
     ================================================================ -->
<div class="search-overlay" id="searchOverlay" hidden>
  <div class="search-panel" id="searchPanel" role="dialog" aria-modal="true">
    <div class="search-input-row">
      <svg class="search-input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" /></svg>
      <input class="search-input" id="searchInput" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="searchResults" autocomplete="off" spellcheck="false">
      <kbd class="search-esc">esc</kbd>
    </div>
    <div class="search-body" id="searchBody">
      <div class="search-message" id="searchMessage"></div>
      <div class="search-results" id="searchResults" role="listbox"></div>
      <div class="search-grant" id="searchGrant" hidden>
        <svg class="search-grant-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" /></svg>
        <div class="search-grant-text"><b id="searchGrantTitle"></b><span id="searchGrantText"></span><span class="search-grant-error" id="searchGrantError" role="alert" hidden></span></div>
        <button class="search-grant-btn" id="searchGrantBtn" type="button"></button>
      </div>
      <!-- Chrome has no switch for optional permissions, so turning them off happens here -->
      <div class="search-grant is-on" id="searchGranted" hidden>
        <svg class="search-grant-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 10.5V6.75a4.5 4.5 0 1 1 9 0v3.75M3.75 21.75h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H3.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" /></svg>
        <div class="search-grant-text"><b id="searchGrantedTitle"></b><span id="searchGrantedText"></span><span class="search-grant-error" id="searchRevokeError" role="alert" hidden></span></div>
        <button class="search-grant-btn" id="searchRevokeBtn" type="button"></button>
      </div>
    </div>
    <div class="search-foot" id="searchFoot"></div>
  </div>
</div>

<!-- ================================================================
     TOAST — floats above everything, used for action confirmations
     Hidden by default via CSS (opacity:0, translateY)
     ================================================================ -->
<div class="toast" id="toast">
  <!-- Checkmark circle icon (Heroicons outline) -->
  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
  </svg>
  <span id="toastText"></span>
  <button class="toast-action" id="toastAction" data-action="undo-last" style="display:none"></button>
</div>

<!-- Optional grouping overrides (LOCAL_LANDING_PAGE_PATTERNS, LOCAL_CUSTOM_GROUPS) -->
<script src="config.js"></script>

<!-- i18n — auto-detects browser language (en / zh-CN) -->
<script src="i18n.js"></script>

<!-- Pure helpers shared with the Node tests -->
<script src="lib/sanitize.js"></script>
<script src="lib/grouping.js"></script>
<script src="lib/close-undo.js"></script>
<script src="lib/collected-store.js"></script>
<script src="lib/config-io.js"></script>
<script src="lib/live-refresh.js"></script>
<script src="lib/search.js"></script>

<!-- Main dashboard logic — loads last so the DOM is ready -->
<script src="app.js"></script>
</body>
</html>
